# Ablation: batch_size=1024 (course default) vs 4096 (paper)
# All other parameters identical to paper config
general:
  complete_verifier: bab
model:
  onnx_path: ../saved_models/mnist_fcnn.onnx
data:
  dataset: MNIST
  start: 0
  end: 5
specification:
  norm: .inf
  epsilon: 0.02
attack:
  pgd_order: skip
solver:
  batch_size: 1024
  alpha-crown:
    iteration: 20
    lr_alpha: 0.1
    lr_decay: 0.98
  beta-crown:
    iteration: 20
    lr_alpha: 0.01
    lr_beta: 0.03
    lr_decay: 0.98
bab:
  timeout: 120
  branching:
    method: kfsb
    candidates: 5
    reduceop: max
