# Paper-aligned configuration for MNIST FCNN complete BaB verification
# Aligned with VNN-COMP 2021 mnistfc benchmark settings (vnncomp21/mnistfc.yaml)
# Key differences from course M3 configs:
#   - beta-crown.iteration: 20 (paper) instead of 50 (default)
#   - lr_beta: 0.03 (paper) instead of 0.05 (default)
#   - batch_size: 4096 (paper) instead of 1024
#   - bab.timeout: 120 (VNN-COMP 2-layer) instead of 30 (course)
#   - alpha-crown.iteration: 20 (paper) instead of 100 (default)
general:
  complete_verifier: bab
model:
  onnx_path: ../saved_models/mnist_fcnn.onnx
data:
  dataset: MNIST
  start: 0
  end: 5
specification:
  norm: .inf
  epsilon: 0.02
attack:
  pgd_order: skip
solver:
  batch_size: 4096
  alpha-crown:
    iteration: 20
    lr_alpha: 0.1
    lr_decay: 0.98
  beta-crown:
    iteration: 20
    lr_alpha: 0.01
    lr_beta: 0.03
    lr_decay: 0.98
bab:
  timeout: 120
  branching:
    method: kfsb
    candidates: 5
    reduceop: max
